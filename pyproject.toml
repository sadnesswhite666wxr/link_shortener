[project]
name = "link_shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "gzemchenkoit-nbru",email = "g.zemchenko@it-nb.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.0,<0.137.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.45.0,<0.46.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "redis (>=7.4.0,<8.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)"
]

[tool.poetry]
packages = [{include = "app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | alembic/versions
  | build
  | dist
)/
'''